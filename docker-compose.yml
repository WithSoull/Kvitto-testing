services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kvitto
      POSTGRES_PASSWORD: kvitto
      POSTGRES_DB: kvitto
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kvitto -d kvitto"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://kvitto:kvitto@db:5432/kvitto
      # Dev default so `docker compose up` works out of the box; override in real deployments.
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
