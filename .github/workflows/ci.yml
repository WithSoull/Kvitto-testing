name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.19"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kvitto
          POSTGRES_PASSWORD: kvitto
          POSTGRES_DB: kvitto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kvitto -d kvitto_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://kvitto:kvitto@localhost:5432/kvitto_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.19"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -v

  smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --detach --wait
      - name: Wait for the API and call it
        run: |
          for _ in $(seq 1 30); do
            curl --silent --fail localhost:8000/health && break
            sleep 1
          done
          # Tariffs come from the seed migration, so this also proves migrations ran.
          curl --silent --fail localhost:8000/tariffs | grep --quiet '"id":"premium"'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
